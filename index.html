<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Challenge S42: Cutthroat — Fantasy League</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-void: #0b0b0d;
      --bg-panel: #16161a;
      --accent-burnt-orange: #d1571f;
      --text-primary: #ece7e1;
      --text-muted: #9a9590;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg-void); }
    body {
      margin: 0 auto;
      padding: 16px;
      max-width: 480px;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }
    h1 { color: var(--accent-burnt-orange); font-size: 1.15rem; letter-spacing: 0.04em; }
    h2 { font-size: 1.05rem; margin-top: 32px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
    h3 { font-size: 1rem; margin-top: 24px; }
    h4 {
      font-size: 0.8rem;
      margin-top: 20px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    p.note { color: var(--text-muted); font-size: 0.85rem; }
    form#setup-form, form#unlock-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0d0d0f;
      color: var(--text-primary);
      font-size: 16px;
      min-height: 46px;
    }
    button {
      background: var(--accent-burnt-orange);
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
    }
    button.btn-inline {
      display: inline-block;
      width: auto;
      min-height: 38px;
      padding: 8px 14px;
      font-size: 0.8rem;
      margin: 4px 0 4px 0;
    }
    #status { margin: 16px 0; font-size: 0.9rem; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
    pre {
      background: var(--bg-panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px;
      max-height: 320px;
      overflow: auto;
      font-size: 0.72rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    ul { padding-left: 20px; margin: 8px 0; }
    li { margin-bottom: 8px; }
    label.checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.95rem;
      color: var(--text-primary);
    }
    label.checkbox-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      min-height: 0;
      flex-shrink: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>THE CHALLENGE S42: CUTTHROAT — FANTASY LEAGUE</h1>
  <p class="note">Milestone 1 debug shell — data layer only. Real commissioner/player UI comes in later milestones.</p>

  <form id="setup-form">
    <label>
      GitHub Gist Personal Access Token
      <input id="token-input" type="password" autocomplete="off" placeholder="ghp_..." />
    </label>
    <label>
      Gist ID
      <input id="gistid-input" type="text" autocomplete="off" placeholder="e.g. 1a2b3c4d5e6f..." />
    </label>
    <button type="submit">Connect</button>
  </form>

  <div id="status"></div>

  <div class="actions">
    <button id="seed-button" type="button">Seed Initial Data (first-time setup only)</button>
    <button id="reload-button" type="button">Force Reload from Gist</button>
  </div>

  <h2>Commissioner</h2>
  <form id="unlock-form">
    <input id="password-input" type="password" autocomplete="off" placeholder="Commissioner password" />
    <button type="submit">Unlock</button>
  </form>
  <div id="commissioner-panel" style="display:none;">
    <h3>Preseason Draft</h3>
    <div id="draft-container"></div>

    <h3>Episode Entry</h3>
    <div id="episode-container"></div>
  </div>

  <h2>Raw state.json</h2>
  <pre id="state-dump">(not loaded yet)</pre>

  <h2>Computed leaderboard (scoring.js output)</h2>
  <pre id="leaderboard-dump">(not loaded yet)</pre>

  <script type="module" src="js/app.js"></script>
</body>
</html>
